[package]
name = "OneWardBackend"
version = "0.1.0"
edition = "2021"

[dependencies]
salvo = { version = "0.89.3", features = ["anyhow"] }
sea-orm = { version = "2.0.0-rc.37", features = ["sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gstreamer = "0.25.0"
gstreamer-app = "0.25.0"
gstreamer-video = "0.25.0"
anyhow = "1.0"
uuid = { version = "1.23.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
