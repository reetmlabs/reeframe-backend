services:
  vms:
    build: .
    ports:
      - "${VMS_PORT:-8080}:8080"
      - "${VMS_RTSP_PORT:-8554}:8554"
    environment:
      # Required. Generate each with: openssl rand -base64 32
      VMS_ENCRYPTION_KEY: "${VMS_ENCRYPTION_KEY:?VMS_ENCRYPTION_KEY is not set, generate one with openssl rand -base64 32}"
      VMS_AUTH__JWT_SECRET: "${VMS_AUTH__JWT_SECRET:?VMS_AUTH__JWT_SECRET is not set, generate one with openssl rand -base64 32}"
      # Optional overrides (Dockerfile defaults are used if not set)
      VMS_DATABASE__URL: sqlite:///var/lib/reeframe/reeframe.db
      VMS_MEDIA__RECORDING_DIR: /var/lib/reeframe/recordings
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - reeframe-data:/var/lib/reeframe
    restart: unless-stopped

volumes:
  # Holds both the SQLite database file and the MP4 recording chunks.
  # Back this up to keep recordings and pipeline config persistent.
  reeframe-data:
