services:
  vms:
    build: .
    ports:
      - "${VMS_PORT:-8080}:8080"
    environment:
      # Required — generate with: openssl rand -base64 32
      VMS_ENCRYPTION_KEY: ${VMS_ENCRYPTION_KEY:?VMS_ENCRYPTION_KEY is not set. Generate one with: openssl rand -base64 32}
      # Optional overrides (Dockerfile defaults are used if not set)
      VMS_DATABASE__URL: sqlite:///var/lib/onward/onward.db
      VMS_MEDIA__RECORDING_DIR: /var/lib/onward/recordings
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - onward-data:/var/lib/onward
    restart: unless-stopped

volumes:
  # Holds both the SQLite database file and the MP4 recording chunks.
  # Back this up to keep recordings and pipeline config persistent.
  onward-data:
