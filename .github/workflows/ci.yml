name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # CI uses SQLite only, so no external database is needed
  DATABASE_URL: sqlite:./feeds.db?mode=rwc
  # cargo-deny release installed on GitHub-hosted runners; keep the self-hosted runner on the same one
  CARGO_DENY_VERSION: 0.22.2

jobs:
  lint:
    name: fmt · clippy · licenses
    # PRs from forks run on GitHub-hosted runners, everything else on the self-hosted runner
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","x64","wsl"]') }}
    steps:
      - uses: actions/checkout@v4

      # A full rebuild on top of a restored cache can fill the runner disk.
      # Steps guarded by runner.environment set up a fresh GitHub VM; the
      # self-hosted runner already has them (see docs/ci-runner.md).
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The gstreamer-* crates link against these C libraries via pkg-config.
      - name: Install GStreamer dev packages
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-nice

      # Caches the registry and target dir, keyed on Cargo.lock and the toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep ~/.cargo/bin as it is, so the self-hosted runner's preinstalled cargo-deny survives the post step
          cache-bin: "false"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-deny
        if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      # Every dependency must use a license allowed in deny.toml
      - name: License check
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check licenses

  test:
    name: test
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","x64","wsl"]') }}
    steps:
      - uses: actions/checkout@v4

      # A full rebuild on top of a restored cache can fill the runner disk
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The gstreamer-* crates link against these C libraries via pkg-config.
      - name: Install GStreamer dev packages
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-nice

      # Ubuntu 24.04 ships gst-libav 1.24.1, which leaks memory per decoded frame
      # and fails the daemon's startup check, so build the fixed 1.24.2 once and cache it.
      - name: Cache gst-libav 1.24.2
        id: gst-libav-cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/gst-libav
          key: gst-libav-1.24.2-ubuntu-24.04-v1

      - name: Build gst-libav 1.24.2
        if: runner.environment == 'github-hosted' && steps.gst-libav-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends meson ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev
          curl -sSfL https://gstreamer.freedesktop.org/src/gst-libav/gst-libav-1.24.2.tar.xz | tar xJ -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/gst-libav-1.24.2"
          meson setup build --buildtype=release -Ddoc=disabled -Dtests=disabled
          ninja -C build
          mkdir -p ~/gst-libav
          cp build/ext/libav/libgstlibav.so ~/gst-libav/

      - name: Install gst-libav 1.24.2
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get install -y --no-install-recommends gstreamer1.0-tools
          PLUGINS=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
          sudo dpkg-divert --divert $PLUGINS/libgstlibav.so.distrib --rename --add $PLUGINS/libgstlibav.so
          sudo install -m644 ~/gst-libav/libgstlibav.so $PLUGINS/
          rm -rf ~/.cache/gstreamer-1.0

      # Runs on every runner, so a self-hosted image with the wrong plugin fails here
      - name: Check gst-libav version
        run: |
          if ! gst-inspect-1.0 libav | grep -E 'Version +1\.24\.2$' >/dev/null; then
            echo "::error::gst-libav 1.24.2 is required but gst-inspect-1.0 libav reports a different or missing version. See docs/ci-runner.md for how to install it."
            exit 1
          fi

      # Caches the registry and target dir, keyed on Cargo.lock and the toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep ~/.cargo/bin as it is, so the self-hosted runner's preinstalled cargo-deny survives the post step
          cache-bin: "false"

      - name: Test
        run: cargo test --all-targets

  # Branch protection requires this check name. It passes only if both jobs
  # above passed, since a skipped required check would count as passing.
  ci:
    name: fmt · clippy · build · test
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require lint and test to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
