name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # CI uses SQLite only, so no external database is needed
  DATABASE_URL: sqlite:./feeds.db?mode=rwc

jobs:
  ci:
    name: fmt · clippy · build · test
    runs-on: ubuntu-24.04

    steps:
      # ----------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------
      - uses: actions/checkout@v4

      # A full rebuild on top of a restored cache can fill the runner disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # ----------------------------------------------------------------
      # Rust toolchain (stable + rustfmt + clippy)
      # ----------------------------------------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ----------------------------------------------------------------
      # GStreamer native dependencies
      # The gstreamer-* crates link against these C libraries via pkg-config.
      # ----------------------------------------------------------------
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # ----------------------------------------------------------------
      # Cargo cache, keyed on Cargo.lock so dependency changes invalidate it
      # ----------------------------------------------------------------
      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ----------------------------------------------------------------
      # Format check
      # ----------------------------------------------------------------
      - name: Check formatting
        run: cargo fmt --all -- --check

      # ----------------------------------------------------------------
      # Clippy (deny warnings)
      # ----------------------------------------------------------------
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Every dependency must use a license allowed in deny.toml
      - name: License check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      # ----------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------
      - name: Build
        run: cargo build --all-targets

      # ----------------------------------------------------------------
      # Tests
      # ----------------------------------------------------------------
      - name: Test
        run: cargo test --all-targets
