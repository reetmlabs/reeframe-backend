name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # CI uses SQLite only, so no external database is needed
  DATABASE_URL: sqlite:./feeds.db?mode=rwc

jobs:
  lint:
    name: fmt · clippy · licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A full rebuild on top of a restored cache can fill the runner disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The gstreamer-* crates link against these C libraries via pkg-config.
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # Caches the registry and target dir, keyed on Cargo.lock and the toolchain
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Every dependency must use a license allowed in deny.toml
      - name: License check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A full rebuild on top of a restored cache can fill the runner disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The gstreamer-* crates link against these C libraries via pkg-config.
      - name: Install GStreamer dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      # Caches the registry and target dir, keyed on Cargo.lock and the toolchain
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all-targets

  # Branch protection requires this check name. It passes only if both jobs
  # above passed, since a skipped required check would count as passing.
  ci:
    name: fmt · clippy · build · test
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require lint and test to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
