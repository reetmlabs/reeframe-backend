name: Release

# Runs when a version tag is pushed, for example `git tag v0.2.0 && git push --tags`
on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/reeframe-backend

jobs:
  # ── Job 1: compile the release binary ────────────────────────────────────────
  # One job per architecture, each on a native amd64 or arm64 runner, so the
  # GStreamer dev libraries need no cross-compilation sysroot and nothing runs
  # under QEMU.
  build:
    name: Build binary (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cache the Cargo registry and compiled dependencies between runs.
      # Keyed by arch too, since amd64 and arm64 artifacts are never compatible.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build release binary
        run: cargo build --release --bin vms-daemon

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vms-daemon-linux-${{ matrix.arch }}
          path: target/release/vms-daemon
          retention-days: 1

  # ── Job 2: assemble .tar.gz and .deb ─────────────────────────────────────────
  # Packages the already-built binary, so it runs on a plain amd64 runner
  # for both arches, no native/arm hardware needed here.
  package:
    name: Package (.tar.gz + .deb) [linux/${{ matrix.arch }}]
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: vms-daemon-linux-${{ matrix.arch }}
          path: artifacts/

      - name: Set release version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ── .tar.gz ──────────────────────────────────────────────────────────────
      - name: Assemble tar archive
        run: |
          STAGING="reeframe-backend-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$STAGING/bin" "$STAGING/systemd"

          install -m 0755 artifacts/vms-daemon         "$STAGING/bin/vms-daemon"
          install -m 0644 dist/reeframe.service           "$STAGING/systemd/reeframe.service"

          # Minimal install instructions inside the archive
          cat > "$STAGING/README.txt" <<EOF
          Reeframe VMS v${VERSION}

          Install:
            sudo install -m 0755 bin/vms-daemon /usr/local/bin/vms-daemon
            sudo install -m 0644 systemd/reeframe.service /etc/systemd/system/reeframe.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now reeframe.service

          Configuration:
            sudo mkdir -p /etc/reeframe
            echo "VMS_ENCRYPTION_KEY=\$(openssl rand -base64 32)" | sudo tee /etc/reeframe/env
            sudo chmod 600 /etc/reeframe/env
          EOF

          tar -czf "reeframe-backend-${VERSION}-linux-${{ matrix.arch }}.tar.gz" "$STAGING"

      # ── .deb ─────────────────────────────────────────────────────────────────
      - name: Assemble .deb package
        run: |
          PKG="reeframe-backend_${VERSION}_${{ matrix.arch }}"
          mkdir -p \
            "$PKG/DEBIAN" \
            "$PKG/usr/local/bin" \
            "$PKG/etc/systemd/system"

          # Maintainer scripts
          install -m 0755 dist/debian/postinst "$PKG/DEBIAN/postinst"
          install -m 0755 dist/debian/postrm   "$PKG/DEBIAN/postrm"

          # Inject the real version and this matrix leg's arch into the control file
          sed \
            -e "s/^Version:.*/Version: ${VERSION}/" \
            -e "s/^Architecture:.*/Architecture: ${{ matrix.arch }}/" \
            dist/debian/control > "$PKG/DEBIAN/control"

          # Payload files
          install -m 0755 artifacts/vms-daemon  "$PKG/usr/local/bin/vms-daemon"
          install -m 0644 dist/reeframe.service   "$PKG/etc/systemd/system/reeframe.service"

          dpkg-deb --build --root-owner-group "$PKG"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: |
            reeframe-backend-*.tar.gz
            reeframe-backend_*.deb
          retention-days: 1

  # ── Job 3: build and push a per-arch Docker image, by digest only ───────────
  # Each leg builds natively on its own architecture and pushes an untagged
  # image identified by digest. The `docker-manifest` job below merges the
  # digests into the multi-arch tags, which is Docker's documented way to split
  # a multi-platform build across native runners.
  docker-build:
    name: Docker build (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ── Job 4: merge the per-arch digests into the real multi-arch tags ─────────
  docker-manifest:
    name: Docker manifest (multi-arch)
    runs-on: ubuntu-22.04
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Word-splitting below is the point: each $(...) expands into
          # multiple separate `-t`/image-ref arguments.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect merged image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # ── Job 5: create GitHub Release and attach artifacts ────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-22.04
    needs: [package, docker-manifest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-cliff can see all commits
          fetch-tags: true # tags are the boundary markers for each release

      # Generate the changelog section for this tag only (strips the global header).
      - name: Generate changelog
        uses: orhun/git-cliff-action@v3
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      # Combine the human-written header, the static install block, and the
      # generated commit changelog into a single release body.
      #
      # Before tagging vX.Y.Z: create release-notes/vX.Y.Z.md with a short
      # summary of the release. The file is optional; without it the body
      # starts directly with the install options.
      - name: Assemble release notes
        env:
          DOCKER_IMAGE: ghcr.io/${{ env.IMAGE }}:${{ github.ref_name }}
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          {
            # Per-version human-written summary (one file per release, never changes).
            NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
            if [ -f "${NOTES_FILE}" ]; then
              cat "${NOTES_FILE}"
              echo ""
              echo "---"
              echo ""
            fi

            echo "## Install options"
            echo ""
            echo "**Docker (recommended)**"
            echo '```bash'
            echo "docker pull ${DOCKER_IMAGE}"
            echo '```'
            echo ""
            echo "**Debian / Ubuntu (.deb)**"
            echo '```bash'
            echo "sudo dpkg -i reeframe-backend_*_\$(dpkg --print-architecture).deb"
            echo "sudo sh -c 'echo VMS_ENCRYPTION_KEY=\$(openssl rand -base64 32) >> /etc/reeframe/env'"
            echo "sudo sh -c 'echo VMS_AUTH__JWT_SECRET=\$(openssl rand -base64 32) >> /etc/reeframe/env'"
            echo "sudo systemctl start reeframe.service"
            echo '```'
            echo ""
            echo "**Manual (.tar.gz)**"
            echo "See \`README.txt\` inside the archive."
            echo ""
            echo "---"
            echo ""
            echo "## What changed"
            echo ""
            printf '%s\n' "${CHANGELOG}"
          } > RELEASE_NOTES.md

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: packages-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reeframe VMS ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
