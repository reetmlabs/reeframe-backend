name: Release

# A version tag (`git tag v0.3.0 && git push origin v0.3.0`) builds everything,
# pushes the Docker image and creates the GitHub release. Running the workflow
# by hand is a dry run: it builds the same assets and uploads them as workflow
# artifacts, without pushing images or creating a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/reeframe-backend
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  # ── The version, from the daemon's Cargo.toml ────────────────────────────────
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check it against the tag
        id: version
        run: |
          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' crates/vms-daemon/Cargo.toml | head -1)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ── The release binary ───────────────────────────────────────────────────────
  # Built in Debian 12 against GStreamer 1.22, so the same binary also runs on
  # Ubuntu 24.04 (GStreamer 1.24, newer glibc). Each arch builds on its own
  # runner, so nothing is cross-compiled or emulated.
  build:
    name: Build binary (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer dev libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            libssl-dev

      # Keyed by arch too, since amd64 and arm64 artifacts are never compatible.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: debian12-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: debian12-${{ matrix.arch }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --bin vms-daemon

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vms-daemon-linux-${{ matrix.arch }}
          path: target/release/vms-daemon
          retention-days: 1

  # ── gst-libav 1.24.2 for the Ubuntu 24.04 package ───────────────────────────
  # Ubuntu 24.04 ships gst-libav 1.24.1, which the daemon refuses, so the
  # Ubuntu package carries its own plugin built against the distro FFmpeg.
  gst-libav:
    name: Build gst-libav (ubuntu24.04/amd64)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build gst-libav
        run: dist/ubuntu/build-gst-libav.sh out

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: gst-libav-ubuntu24.04-amd64
          path: out/libgstlibav.so
          retention-days: 1

  # ── .deb per distro, and .tar.gz per arch ────────────────────────────────────
  package:
    name: Package (${{ matrix.distro }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    needs: [version, build, gst-libav]
    strategy:
      matrix:
        include:
          - distro: debian12
            arch: amd64
            tarball: true
          - distro: ubuntu24.04
            arch: amd64
            tarball: false
          - distro: debian12
            arch: arm64
            tarball: true
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: vms-daemon-linux-${{ matrix.arch }}
          path: artifacts/

      - name: Download gst-libav
        if: matrix.distro == 'ubuntu24.04'
        uses: actions/download-artifact@v4
        with:
          name: gst-libav-ubuntu24.04-${{ matrix.arch }}
          path: artifacts/

      - name: Assemble .deb package
        run: |
          LIBAV=""
          if [ "${{ matrix.distro }}" = ubuntu24.04 ]; then LIBAV=artifacts/libgstlibav.so; fi
          dist/debian/build-deb.sh "${{ matrix.distro }}" "${{ matrix.arch }}" "$VERSION" \
            artifacts/vms-daemon $LIBAV

      - name: Assemble tar archive
        if: matrix.tarball
        run: |
          STAGING="reeframe-backend-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$STAGING/bin" "$STAGING/systemd"

          install -m 0755 artifacts/vms-daemon         "$STAGING/bin/vms-daemon"
          # Manual installs go to /usr/local/bin, so the archive's unit runs it from there.
          sed 's|^ExecStart=/usr/bin/|ExecStart=/usr/local/bin/|' dist/reeframe.service > "$STAGING/systemd/reeframe.service"
          chmod 0644 "$STAGING/systemd/reeframe.service"
          install -m 0644 LICENSE NOTICE                  "$STAGING/"

          # Minimal install instructions inside the archive
          cat > "$STAGING/README.txt" <<EOF
          Reeframe VMS v${VERSION}

          Built on Debian 12 against GStreamer 1.22. On Ubuntu 24.04 use the
          ubuntu24.04 .deb instead, since the distro gst-libav 1.24.1 is refused.

          Install:
            sudo install -m 0755 bin/vms-daemon /usr/local/bin/vms-daemon
            sudo install -m 0644 systemd/reeframe.service /etc/systemd/system/reeframe.service
            sudo systemctl daemon-reload
            sudo systemctl enable --now reeframe.service

          Configuration:
            sudo mkdir -p /etc/reeframe
            echo "VMS_ENCRYPTION_KEY=\$(openssl rand -base64 32)" | sudo tee /etc/reeframe/env
            echo "VMS_AUTH__JWT_SECRET=\$(openssl rand -base64 32)" | sudo tee -a /etc/reeframe/env
            sudo chmod 600 /etc/reeframe/env
          EOF

          tar -czf "reeframe-backend-${VERSION}-linux-${{ matrix.arch }}.tar.gz" "$STAGING"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.distro }}-${{ matrix.arch }}
          path: |
            reeframe-backend-*.tar.gz
            reeframe-backend_*.deb
          retention-days: 1

  # ── Every release asset and SHA256SUMS, as one artifact ──────────────────────
  assets:
    name: Release assets
    runs-on: ubuntu-24.04
    needs: package
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: packages-*
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          retention-days: ${{ env.PUBLISH == 'true' && 1 || 7 }}

  # ── Docker image per arch; a tag push pushes it by digest only ───────────────
  # Each leg builds natively on its own architecture. On a tag push it pushes
  # an untagged image identified by digest, and the `docker-manifest` job below
  # merges the digests into the multi-arch tags. A dry run only builds.
  docker-build:
    name: Docker build (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ── Merge the per-arch digests into the multi-arch tags ──────────────────────
  docker-manifest:
    name: Docker manifest (multi-arch)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: docker-build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Word-splitting below is the point: each $(...) expands into
          # multiple separate `-t`/image-ref arguments.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect merged image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # ── Create the GitHub release and attach the assets ─────────────────────────
  release:
    name: GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: [version, assets, docker-manifest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git-cliff can see all commits
          fetch-tags: true # tags are the boundary markers for each release

      # Generate the changelog section for this tag only (strips the global header).
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      # Combine the human-written header, the static install block, and the
      # generated commit changelog into a single release body.
      #
      # Before tagging vX.Y.Z: create release-notes/vX.Y.Z.md with a short
      # summary of the release. The file is optional; without it the body
      # starts directly with the install options.
      - name: Assemble release notes
        env:
          DOCKER_IMAGE: ghcr.io/${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ steps.cliff.outputs.content }}
        run: |
          {
            # Per-version human-written summary (one file per release, never changes).
            NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
            if [ -f "${NOTES_FILE}" ]; then
              cat "${NOTES_FILE}"
              echo ""
              echo "---"
              echo ""
            fi

            echo "## Install options"
            echo ""
            echo "**Docker**"
            echo '```bash'
            echo "docker pull ${DOCKER_IMAGE}"
            echo '```'
            echo ""
            echo "**Debian 12 / Ubuntu 24.04 (.deb, amd64)**"
            echo '```bash'
            echo "sudo install -d -m 0755 /etc/reeframe"
            echo "sudo sh -c 'umask 077; { echo VMS_ENCRYPTION_KEY=\$(openssl rand -base64 32); echo VMS_AUTH__JWT_SECRET=\$(openssl rand -base64 32); } > /etc/reeframe/env'"
            echo "sudo apt install ./reeframe-backend_${VERSION}_debian12_amd64.deb      # Debian 12"
            echo "sudo apt install ./reeframe-backend_${VERSION}_ubuntu24.04_amd64.deb   # Ubuntu 24.04"
            echo '```'
            echo ""
            echo "Then create the first admin with \`POST /auth/setup\` on port 8080. Check downloads against \`SHA256SUMS\`."
            echo ""
            echo "**Manual (.tar.gz)**"
            echo "See \`README.txt\` inside the archive."
            echo ""
            echo "---"
            echo ""
            echo "## What changed"
            echo ""
            printf '%s\n' "${CHANGELOG}"
          } > RELEASE_NOTES.md

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reeframe VMS ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
