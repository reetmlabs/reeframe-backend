[package]
name    = "vms-daemon"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "vms-daemon"
path = "src/main.rs"

[dependencies]
vms-core       = { path = "../vms-core" }
vms-db         = { path = "../vms-db" }
vms-media      = { path = "../vms-media" }
vms-sources    = { path = "../vms-sources" }
vms-engine     = { path = "../vms-engine" }
vms-api        = { path = "../vms-api" }
vms-webrtc     = { path = "../vms-webrtc" }
tokio             = { workspace = true }
salvo             = { workspace = true }
figment           = { workspace = true }
clap              = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
sea-orm           = { workspace = true }
sea-orm-migration = { workspace = true }
uuid              = { workspace = true }
rand              = { workspace = true }
base64            = { workspace = true }
ed25519-dalek     = { version = "2", features = ["rand_core", "pkcs8"] }
reeframe-protocol = { git = "https://github.com/reetmlabs/reeframe-protocol", tag = "v0.3.0" }
quinn             = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls            = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen             = "0.13"
webpki-roots      = "1"
tokio-util        = { workspace = true }
futures           = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls      = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
percent-encoding  = "2"
reqwest           = { workspace = true, features = ["rustls-tls-manual-roots-no-provider"] }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow            = { workspace = true }
opentelemetry                  = { workspace = true }
opentelemetry_sdk              = { workspace = true }
opentelemetry-otlp             = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry          = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
jsonwebtoken = { workspace = true }
